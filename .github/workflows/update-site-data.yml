# History Illustrated: refreshes videos.json and downloads.json every hour.
# This file goes at .github/workflows/update-site-data.yml

name: Update site data

on:
  schedule:
    - cron: '17 * * * *'   # every hour, at 17 minutes past
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the video list from YouTube
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: node fetch-videos.mjs

      - name: Fetch the downloads list from Drive
        if: always()
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
          DRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER }}
        run: node fetch-downloads.mjs

      - name: Save whatever changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update site data"
            git push
          fi
